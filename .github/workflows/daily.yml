name: Daily market dashboard

on:
  schedule:
    - cron: "0 22 * * 1-5"   # 월~금 22:00 UTC = 화~토 07:00 KST
  workflow_dispatch:          # Actions 탭의 "Run workflow" 버튼으로 수동 실행

permissions:
  contents: write

concurrency:
  group: daily-dashboard
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      - name: FRED connection check
        continue-on-error: true
        run: |
          URL="https://fred.stlouisfed.org/graph/fredgraph.csv?id=DGS10"
          echo "기본 요청: $(curl -s -o /dev/null -w '%{http_code}' -m 60 "$URL")"
          echo "브라우저 요청: $(curl -s -o /dev/null -w '%{http_code}' -m 60 -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/128.0' "$URL")"
          curl -s -m 60 -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/128.0' "$URL" | head -3

      - name: Build dashboard
        run: python main.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs data
          git diff --staged --quiet || git commit -m "Dashboard update $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M KST')"
          git push
